# ─────────────────────────────────────────────────────────────────────────────
# Da incollare in .htaccess nella root del sito.
#
# ATTENZIONE ALL'ORDINE: va messo **fuori e sopra** il blocco
# `# BEGIN WordPress … # END WordPress`. WordPress riscrive quel blocco da capo
# ogni volta che si salvano i permalink, e quello che ci sta dentro sparisce.
# ─────────────────────────────────────────────────────────────────────────────


# ── 1 · Niente compressione sui formati già compressi ────────────────────────
#
# Il server oggi applica gzip a tutto, MP4 e WebP e WOFF2 compresi. Su formati
# già compressi il risparmio è zero, ma il danno sui video è reale e misurato:
#
#   Accept-Encoding: gzip      → HTTP 200, content-encoding: gzip, Range ignorato
#   Accept-Encoding: identity  → HTTP 206, content-range: bytes 0-999/1029666
#
# Un corpo gzippato non si può chiedere a pezzi. Quindi: niente riproduzione
# progressiva (il browser deve scaricare tutto il file prima di partire) e
# niente seek — cioè lo scrub temporale sulle thumbnail non può funzionare,
# per quanto bene siano encodati i loop.
#
# `no-gzip` spegne mod_deflate per quella richiesta anche se una regola più
# larga l'ha già acceso; `dont-vary` evita di aggiungerci un Vary inutile.
<IfModule mod_deflate.c>
  SetEnvIfNoCase Request_URI \.(?:mp4|m4v|webm|mov|avi|m3u8|ts)$   no-gzip dont-vary
  SetEnvIfNoCase Request_URI \.(?:jpe?g|png|gif|webp|avif|ico)$    no-gzip dont-vary
  SetEnvIfNoCase Request_URI \.(?:woff2?|ttf|otf|eot)$             no-gzip dont-vary
  SetEnvIfNoCase Request_URI \.(?:gz|zip|bz2|rar|7z|pdf)$          no-gzip dont-vary
</IfModule>


# ── 2 · Vary: User-Agent ─────────────────────────────────────────────────────
#
# Il server manda `Vary: Accept-Encoding,User-Agent` su tutto. Lo `User-Agent`
# arriva quasi sempre da vecchie righe `BrowserMatch ^Mozilla/4` per Netscape:
# se le trovi in .htaccess o nella configurazione dell'host, si cancellano.
#
# Il costo è che ogni proxy e ogni CDN tiene una copia separata per **ogni**
# stringa di browser, e sono migliaia: la cache condivisa smette di funzionare.
# Sui file statici la sola dimensione che conta è la codifica.
<IfModule mod_headers.c>
  <FilesMatch "\.(css|js|mp4|m4v|webm|webp|avif|jpe?g|png|gif|svg|woff2?|ico)$">
    Header set Vary Accept-Encoding
  </FilesMatch>
</IfModule>


# ── 3 · Range esplicito ──────────────────────────────────────────────────────
#
# Ridondante con Apache di serie, ma esplicito costa niente ed è la garanzia
# che i video restino richiedibili a pezzi anche se l'host cambia i default.
<IfModule mod_headers.c>
  <FilesMatch "\.(mp4|m4v|webm|mov)$">
    Header set Accept-Ranges bytes
  </FilesMatch>
</IfModule>
